name: Agent Surface

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-agent-surface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify agent surface
        run: |
          bash scripts/verify_agent_surface.sh
